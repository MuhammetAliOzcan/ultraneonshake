<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Neon Snake - M.ALİ ÖZCAN</title>

<style>
:root{
  --bg1:#0f0c29;
  --bg2:#302b63;
  --bg3:#24243e;
  --text:#fff;
  --accent:#00ffcc;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  background:linear-gradient(-45deg,var(--bg1),var(--bg2),var(--bg3));
  background-size:400% 400%;
  animation:gradientBG 12s ease infinite;
}

@keyframes gradientBG{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

h1{
  margin-top:15px;
  text-align:center;
  text-shadow:0 0 20px var(--accent);
}

.top-bar{
  width:100%;
  display:flex;
  justify-content:flex-end;
  padding:10px 20px;
}

button{
  padding:8px 15px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:var(--accent);
  color:#000;
  font-weight:bold;
}

.game-container{
  width:95%;
  max-width:420px;
  backdrop-filter:blur(10px);
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:15px;
  box-shadow:0 0 25px rgba(0,0,0,0.5);
}

canvas{
  width:100%;
  height:auto;
  background:#000;
  border-radius:10px;
  box-shadow:0 0 20px var(--accent);
  touch-action:none;
}

.score{
  margin-top:10px;
  text-align:center;
  font-size:14px;
}

.signature{
  margin-top:auto;
  padding:20px;
  font-size:16px;
  text-align:center;
}

#menu{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.95);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:100;
}
</style>
</head>

<body>

<div class="top-bar">
<button onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<h1>⚡ Ultra Neon Snake</h1>

<div class="game-container">
<canvas id="game"></canvas>
<div class="score">
Skor: <span id="score">0</span> |
En Yüksek Skor: <span id="highscore">0</span>
</div>
<div style="text-align:center;margin-top:10px;">
<button onclick="resetGame()">Tekrar Başlat</button>
</div>
</div>

<div class="signature">M.ALİ ÖZCAN</div>

<div id="menu">
<h2>Ultra Neon Snake</h2>
<p>Seviye seçin:</p>
<button onclick="startGame('easy')">Kolay</button>
<button onclick="startGame('medium')">Orta</button>
<button onclick="startGame('hard')">Zor</button>
<h3>En Yüksek Skor: <span id="menuHigh">0</span></h3>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resizeCanvas(){
  const size=Math.min(window.innerWidth*0.9,400);
  canvas.width=size;
  canvas.height=size;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

const box=20;
let snake,food,score,direction,game,speed;
let highScore=localStorage.getItem("neonSnakeHigh")||0;
document.getElementById("highscore").innerText=highScore;
document.getElementById("menuHigh").innerText=highScore;

function randomFood(){
  const cells=canvas.width/box;
  return{
    x:Math.floor(Math.random()*cells)*box,
    y:Math.floor(Math.random()*cells)*box
  }
}

function collision(head,array){
  return array.some(seg=>seg.x===head.x&&seg.y===head.y)
}

function draw(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  snake.forEach((seg,i)=>{
    ctx.fillStyle=i===0?"#00ffcc":"#00aa88";
    ctx.fillRect(seg.x,seg.y,box,box);
  });

  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.arc(food.x+box/2,food.y+box/2,box/2,0,Math.PI*2);
  ctx.fill();

  let headX=snake[0].x;
  let headY=snake[0].y;

  if(direction==="LEFT") headX-=box;
  if(direction==="UP") headY-=box;
  if(direction==="RIGHT") headX+=box;
  if(direction==="DOWN") headY+=box;

  if(headX===food.x && headY===food.y){
    score++;
    food=randomFood();
  }else{
    snake.pop();
  }

  const newHead={x:headX,y:headY};

  if(headX<0||headY<0||headX>=canvas.width||headY>=canvas.height||collision(newHead,snake)){
    resetGame();
    return;
  }

  snake.unshift(newHead);
  document.getElementById("score").innerText=score;
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"&&direction!=="RIGHT") direction="LEFT";
  if(e.key==="ArrowUp"&&direction!=="DOWN") direction="UP";
  if(e.key==="ArrowRight"&&direction!=="LEFT") direction="RIGHT";
  if(e.key==="ArrowDown"&&direction!=="UP") direction="DOWN";
});

// Swipe kontrol
let startX,startY;
canvas.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
  startY=e.touches[0].clientY;
});

canvas.addEventListener("touchend",e=>{
  let dx=e.changedTouches[0].clientX-startX;
  let dy=e.changedTouches[0].clientY-startY;

  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0 && direction!=="LEFT") direction="RIGHT";
    else if(dx<0 && direction!=="RIGHT") direction="LEFT";
  }else{
    if(dy>0 && direction!=="UP") direction="DOWN";
    else if(dy<0 && direction!=="DOWN") direction="UP";
  }
});

let currentDifficulty="medium";

function startGame(difficulty){
  document.getElementById("menu").style.display="none";
  currentDifficulty=difficulty;
  snake=[{x:box*5,y:box*5}];
  direction=null;
  score=0;
  speed=difficulty==="easy"?150:difficulty==="medium"?100:70;
  food=randomFood();
  clearInterval(game);
  game=setInterval(draw,speed);
}

function resetGame(){
  snake=[{x:box*5,y:box*5}];
  direction=null;
  score=0;
  food=randomFood();
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

document.getElementById("menu").style.display="flex";
</script>
</body>
</html>
