<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Neon Snake</title>

<style>
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
  overflow:hidden;
  color:#00ffcc;
}

canvas{
  background:#050505;
  box-shadow:0 0 30px #00ffcc;
  border-radius:15px;
}

#menu{
  position:absolute;
  display:flex;
  flex-direction:column;
  gap:15px;
  background:rgba(0,0,0,0.9);
  padding:30px;
  border-radius:15px;
  box-shadow:0 0 20px #00ffcc;
}

button{
  padding:10px 20px;
  font-size:18px;
  cursor:pointer;
  border:none;
  border-radius:8px;
}

#score{
  position:absolute;
  top:20px;
  font-size:20px;
}

#leaderboard{
  position:absolute;
  right:20px;
  top:20px;
  background:rgba(0,0,0,0.8);
  padding:15px;
  border-radius:10px;
  box-shadow:0 0 15px #00ffcc;
  font-size:14px;
}

#boardMessage{
  position:absolute;
  bottom:30px;
  font-size:22px;
  color:yellow;
  display:none;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}

@media(max-width:700px){
  #leaderboard{
    right:10px;
    top:auto;
    bottom:10px;
  }
}
</style>
</head>
<body>

<div id="menu">
  <button onclick="startGame('easy')">Easy</button>
  <button onclick="startGame('medium')">Medium</button>
  <button onclick="startGame('hard')">Hard</button>
</div>

<div id="score">Skor: 0</div>
<div id="leaderboard"></div>
<div id="boardMessage">🎉 SKOR TABLOSUNDASIN!</div>

<canvas id="game" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;
let snake, direction, food, score;
let game, baseSpeed, currentSpeed, difficulty;
let shake = 0;

function startGame(diff){
  document.getElementById("menu").style.display="none";
  document.getElementById("boardMessage").style.display="none";

  snake=[{x:200,y:200}];
  direction="RIGHT";
  score=0;
  difficulty=diff;

  if(diff==="easy") baseSpeed=120;
  if(diff==="medium") baseSpeed=90;
  if(diff==="hard") baseSpeed=65;

  currentSpeed=baseSpeed;

  document.getElementById("score").innerText="Skor: 0";

  food=randomFood();

  clearInterval(game);
  game=setInterval(draw,currentSpeed);
}

function randomFood(){
  const cells=canvas.width/box;
  let min=0, max=cells;

  if(difficulty==="easy"){
    min=Math.floor(cells*0.25);
    max=Math.floor(cells*0.75);
  }

  return{
    x:Math.floor(Math.random()*(max-min)+min)*box,
    y:Math.floor(Math.random()*(max-min)+min)*box
  };
}

document.addEventListener("keydown",e=>{
  const key=e.key.toLowerCase();

  if((key==="arrowleft"||key==="a") && direction!=="RIGHT") direction="LEFT";
  if((key==="arrowup"||key==="w") && direction!=="DOWN") direction="UP";
  if((key==="arrowright"||key==="d") && direction!=="LEFT") direction="RIGHT";
  if((key==="arrowdown"||key==="s") && direction!=="UP") direction="DOWN";
});

function collision(head,array){
  return array.some(segment=>segment.x===head.x && segment.y===head.y);
}

function draw(){
  if(shake>0){
    canvas.style.transform=`translate(${Math.random()*10-5}px,${Math.random()*10-5}px)`;
    shake--;
  }else{
    canvas.style.transform="translate(0,0)";
  }

  ctx.fillStyle="#050505";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  snake.forEach((segment,i)=>{
    ctx.fillStyle=i===0?"#00ffcc":"#00aa88";
    ctx.fillRect(segment.x,segment.y,box,box);
  });

  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,box,box);

  let headX=snake[0].x;
  let headY=snake[0].y;

  if(direction==="LEFT") headX-=box;
  if(direction==="RIGHT") headX+=box;
  if(direction==="UP") headY-=box;
  if(direction==="DOWN") headY+=box;

  if(headX===food.x && headY===food.y){
    score++;
    document.getElementById("score").innerText="Skor: "+score;
    food=randomFood();

    if(currentSpeed>40){
      currentSpeed-=2;
      clearInterval(game);
      game=setInterval(draw,currentSpeed);
    }

  }else{
    snake.pop();
  }

  const newHead={x:headX,y:headY};

  if(
    headX<0 || headY<0 ||
    headX>=canvas.width || headY>=canvas.height ||
    collision(newHead,snake)
  ){
    shake=15;
    clearInterval(game);
    setTimeout(endGame,400);
    return;
  }

  snake.unshift(newHead);
}

function endGame(){
  checkLeaderboard();
  document.getElementById("menu").style.display="flex";
}

function getScores(){
  return JSON.parse(localStorage.getItem("snakeScores")) || [];
}

function saveScores(scores){
  localStorage.setItem("snakeScores",JSON.stringify(scores));
}

function updateLeaderboard(){
  const board=document.getElementById("leaderboard");
  const scores=getScores();
  board.innerHTML="<b>🏆 TOP 5</b><br>";
  scores.forEach((s,i)=>{
    board.innerHTML+=`${i+1}. ${s.name} - ${s.score}<br>`;
  });
}

function checkLeaderboard(){
  let scores=getScores();
  if(scores.length<5 || score>scores[scores.length-1].score){
    let name=prompt("Skor tablosuna girdin! İsmini yaz:");
    if(name){
      scores.push({name:name,score:score});
      scores.sort((a,b)=>b.score-a.score);
      scores=scores.slice(0,5);
      saveScores(scores);
      document.getElementById("boardMessage").style.display="block";
    }
  }
  updateLeaderboard();
}

updateLeaderboard();
</script>
</body>
</html>
