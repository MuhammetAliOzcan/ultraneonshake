<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Neon Snake</title>

<style>
body{
  margin:0;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
  overflow:hidden;
}

canvas{
  background:#050505;
  box-shadow:0 0 30px #00ffcc;
  border-radius:15px;
}

#menu{
  position:absolute;
  display:flex;
  flex-direction:column;
  gap:15px;
  background:rgba(0,0,0,0.9);
  padding:30px;
  border-radius:15px;
  box-shadow:0 0 20px #00ffcc;
}

button{
  padding:10px 20px;
  font-size:18px;
  cursor:pointer;
  border:none;
  border-radius:8px;
}

#score{
  position:absolute;
  top:20px;
  color:#00ffcc;
  font-size:20px;
}

@media(max-width:600px){
  canvas{
    width:90vw;
    height:90vw;
  }
}
</style>
</head>
<body>

<div id="menu">
  <button onclick="startGame('easy')">Easy</button>
  <button onclick="startGame('medium')">Medium</button>
  <button onclick="startGame('hard')">Hard</button>
</div>

<div id="score">Skor: 0</div>

<canvas id="game" width="400" height="400"></canvas>

<!-- SESLER (mp3 dosyaları koyarsan çalışır) -->
<audio id="eatSound" src="eat.mp3" preload="auto"></audio>
<audio id="hitSound" src="hit.mp3" preload="auto"></audio>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;
let snake;
let direction;
let food;
let score;
let game;
let baseSpeed;
let currentSpeed;
let currentDifficulty;
let shake = 0;

const eatSound = document.getElementById("eatSound");
const hitSound = document.getElementById("hitSound");

function startGame(diff){
  document.getElementById("menu").style.display="none";

  snake = [{x:200,y:200}];
  direction = "RIGHT";
  score = 0;
  document.getElementById("score").innerText="Skor: 0";

  currentDifficulty = diff;

  if(diff==="easy") baseSpeed = 120;
  if(diff==="medium") baseSpeed = 90;
  if(diff==="hard") baseSpeed = 65;

  currentSpeed = baseSpeed;
  food = randomFood();

  clearInterval(game);
  game = setInterval(draw,currentSpeed);
}

function randomFood(){
  const cells = canvas.width/box;
  let min = 0;
  let max = cells;

  if(currentDifficulty==="easy"){
    min = Math.floor(cells*0.25);
    max = Math.floor(cells*0.75);
  }

  return{
    x:Math.floor(Math.random()*(max-min)+min)*box,
    y:Math.floor(Math.random()*(max-min)+min)*box
  }
}

document.addEventListener("keydown",e=>{
  const key = e.key.toLowerCase();

  if((key==="arrowleft" || key==="a") && direction!=="RIGHT") direction="LEFT";
  if((key==="arrowup" || key==="w") && direction!=="DOWN") direction="UP";
  if((key==="arrowright" || key==="d") && direction!=="LEFT") direction="RIGHT";
  if((key==="arrowdown" || key==="s") && direction!=="UP") direction="DOWN";
});

function collision(head,array){
  for(let i=0;i<array.length;i++){
    if(head.x===array[i].x && head.y===array[i].y) return true;
  }
  return false;
}

function screenShake(){
  shake = 10;
}

function draw(){
  if(shake>0){
    canvas.style.transform=`translate(${Math.random()*10-5}px,${Math.random()*10-5}px)`;
    shake--;
  }else{
    canvas.style.transform="translate(0,0)";
  }

  ctx.fillStyle="#050505";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<snake.length;i++){
    ctx.fillStyle = i===0 ? "#00ffcc" : "#00aa88";
    ctx.fillRect(snake[i].x,snake[i].y,box,box);
  }

  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,box,box);

  let headX = snake[0].x;
  let headY = snake[0].y;

  if(direction==="LEFT") headX-=box;
  if(direction==="RIGHT") headX+=box;
  if(direction==="UP") headY-=box;
  if(direction==="DOWN") headY+=box;

  if(headX===food.x && headY===food.y){
    score++;
    document.getElementById("score").innerText="Skor: "+score;

    eatSound.currentTime=0;
    eatSound.play();

    food = randomFood();

    // hız artışı (çok hafif)
    if(currentSpeed>40){
      currentSpeed -= 2;
      clearInterval(game);
      game = setInterval(draw,currentSpeed);
    }

  }else{
    snake.pop();
  }

  const newHead = {x:headX,y:headY};

  if(
    headX<0 ||
    headY<0 ||
    headX>=canvas.width ||
    headY>=canvas.height ||
    collision(newHead,snake)
  ){
    hitSound.currentTime=0;
    hitSound.play();
    screenShake();
    clearInterval(game);
    setTimeout(()=>{
      document.getElementById("menu").style.display="flex";
    },500);
    return;
  }

  snake.unshift(newHead);
}
</script>
</body>
</html>
