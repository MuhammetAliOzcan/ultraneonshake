<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Neon Snake</title>

<style>
:root{
  --bg1:#0f0c29;
  --bg2:#302b63;
  --bg3:#24243e;
  --accent:#00ffcc;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, sans-serif;
  overflow:hidden;
  color:white;
  background:linear-gradient(-45deg,var(--bg1),var(--bg2),var(--bg3));
  background-size:400% 400%;
  animation:gradientBG 12s ease infinite;
}

@keyframes gradientBG{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.game-wrapper{
  position:relative;
  padding:20px;
  border-radius:20px;
  backdrop-filter:blur(15px);
  background:rgba(255,255,255,0.05);
  box-shadow:0 0 40px rgba(0,255,204,0.4);
}

canvas{
  background:#000;
  border-radius:15px;
  box-shadow:0 0 25px var(--accent);
}

#score{
  text-align:center;
  margin-bottom:10px;
  font-size:18px;
}

button{
  padding:8px 15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:var(--accent);
  font-weight:bold;
}

#menu{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  gap:15px;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.9);
  border-radius:20px;
}

#leaderboardPanel{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.95);
  padding:25px;
  border-radius:15px;
  box-shadow:0 0 25px var(--accent);
  display:none;
}

#topButton{
  position:fixed;
  top:20px;
  right:20px;
  box-shadow:0 0 15px var(--accent);
}

#boardMessage{
  position:absolute;
  bottom:-40px;
  width:100%;
  text-align:center;
  color:yellow;
  display:none;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}
</style>
</head>
<body>

<button id="topButton" onclick="toggleBoard()">🏆 TOP 5</button>

<div class="game-wrapper">
<div id="score">Skor: 0</div>
<canvas id="game" width="400" height="400"></canvas>

<div id="boardMessage">🎉 SKOR TABLOSUNDASIN!</div>

<div id="menu">
  <button onclick="startGame('easy')">Easy</button>
  <button onclick="startGame('medium')">Medium</button>
  <button onclick="startGame('hard')">Hard</button>
</div>
</div>

<div id="leaderboardPanel">
<h3>🏆 EN İYİ 5</h3>
<div id="leaderboard"></div>
<br>
<button onclick="toggleBoard()">Kapat</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const box=20;

let snake,direction,food,score;
let game,baseSpeed,currentSpeed,difficulty;
let shake=0;

function startGame(diff){
  document.getElementById("menu").style.display="none";
  document.getElementById("boardMessage").style.display="none";

  snake=[{x:200,y:200}];
  direction="RIGHT";
  score=0;
  difficulty=diff;

  if(diff==="easy") baseSpeed=120;
  if(diff==="medium") baseSpeed=90;
  if(diff==="hard") baseSpeed=65;

  currentSpeed=baseSpeed;

  document.getElementById("score").innerText="Skor: 0";

  food=randomFood();

  clearInterval(game);
  game=setInterval(draw,currentSpeed);
}

function randomFood(){
  const cells=canvas.width/box;
  let min=0,max=cells;

  if(difficulty==="easy"){
    min=Math.floor(cells*0.25);
    max=Math.floor(cells*0.75);
  }

  return{
    x:Math.floor(Math.random()*(max-min)+min)*box,
    y:Math.floor(Math.random()*(max-min)+min)*box
  };
}

document.addEventListener("keydown",e=>{
  const key=e.key.toLowerCase();
  if((key==="arrowleft"||key==="a")&&direction!=="RIGHT") direction="LEFT";
  if((key==="arrowup"||key==="w")&&direction!=="DOWN") direction="UP";
  if((key==="arrowright"||key==="d")&&direction!=="LEFT") direction="RIGHT";
  if((key==="arrowdown"||key==="s")&&direction!=="UP") direction="DOWN";
});

function collision(head,array){
  return array.some(seg=>seg.x===head.x&&seg.y===head.y);
}

function draw(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  snake.forEach((seg,i)=>{
    ctx.fillStyle=i===0?"#00ffcc":"#00aa88";
    ctx.shadowColor="#00ffcc";
    ctx.shadowBlur=15;
    ctx.fillRect(seg.x,seg.y,box,box);
  });
  ctx.shadowBlur=0;

  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,box,box);

  let headX=snake[0].x;
  let headY=snake[0].y;

  if(direction==="LEFT") headX-=box;
  if(direction==="RIGHT") headX+=box;
  if(direction==="UP") headY-=box;
  if(direction==="DOWN") headY+=box;

  if(headX===food.x&&headY===food.y){
    score++;
    document.getElementById("score").innerText="Skor: "+score;
    food=randomFood();

    if(currentSpeed>40){
      currentSpeed-=2;
      clearInterval(game);
      game=setInterval(draw,currentSpeed);
    }
  }else{
    snake.pop();
  }

  const newHead={x:headX,y:headY};

  if(headX<0||headY<0||headX>=canvas.width||headY>=canvas.height||collision(newHead,snake)){
    clearInterval(game);
    setTimeout(endGame,300);
    return;
  }

  snake.unshift(newHead);
}

function endGame(){
  checkLeaderboard();
  document.getElementById("menu").style.display="flex";
}

function getScores(){
  return JSON.parse(localStorage.getItem("snakeScores"))||[];
}

function saveScores(scores){
  localStorage.setItem("snakeScores",JSON.stringify(scores));
}

function updateLeaderboard(){
  const scores=getScores();
  const board=document.getElementById("leaderboard");
  board.innerHTML="";
  scores.forEach((s,i)=>{
    board.innerHTML+=`${i+1}. ${s.name} - ${s.score}<br>`;
  });
}

function checkLeaderboard(){
  let scores=getScores();
  if(scores.length<5||score>scores[scores.length-1]?.score){
    let name=prompt("Skor tablosuna girdin! İsmini yaz:");
    if(name){
      scores.push({name:name,score:score});
      scores.sort((a,b)=>b.score-a.score);
      scores=scores.slice(0,5);
      saveScores(scores);
      document.getElementById("boardMessage").style.display="block";
    }
  }
  updateLeaderboard();
}

function toggleBoard(){
  const panel=document.getElementById("leaderboardPanel");
  panel.style.display=panel.style.display==="block"?"none":"block";
}

updateLeaderboard();
</script>
</body>
</html>
